<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Ptah Realty - Real Estate Intelligence & Title Cadastre</title>
    <meta name="description" content="Ptah Realty real estate intelligence platform with cadastre maps, property title deeds, structural accommodation, KYC verification suite, and prospecting engine." />
    <meta property="og:title" content="Ptah Realty - Real Estate Intelligence & Title Cadastre" />
    <meta property="og:description" content="Real estate intelligence and property search platform modeled on Ptah Realty." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved luxury theme (Settings > Preferences > Appearance)
      // before React mounts/paints, so there's no flash of the default
      // "emerald" palette before the user's actual choice kicks in.
      try {
        var savedTheme = localStorage.getItem('ptah_theme');
        if (savedTheme && savedTheme !== 'emerald') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
