version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI
  build:
    commands:
      - echo Building image...
      - docker build -t $ECR_REPO_URI:latest .
      - echo "=== Startup smoke test (real entrypoint, 4s window) ==="
      - timeout 4 docker run --rm $ECR_REPO_URI:latest || true
  post_build:
    commands:
      - echo Pushing image...
      - docker push $ECR_REPO_URI:latest
